name: Test market close dates
on:
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tools/requirements.txt pytest
      - run: python -m pytest -q
