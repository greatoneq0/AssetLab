# 매일 아침(KST) 세계 증시 브리핑을 텔레그램으로 발송
# 클라우드(GitHub Actions)에서 실행되므로 내 기기 상태와 무관하게 동작합니다.
name: Daily market news (Telegram)

on:
  schedule:
    # 23:00 UTC = 08:00 KST. GitHub scheduling is best-effort, not an arrival SLA.
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 가능

permissions:
  contents: read

# Never overlap deliveries, including manual runs and other branches.
concurrency:
  group: daily-market-telegram
  cancel-in-progress: false

jobs:
  brief:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Delivery day (KST)
        id: day
        run: echo "key=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: delivery
        with:
          path: .delivery-claim
          key: telegram-day-${{ steps.day.outputs.key }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Check Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in repository Actions secrets."
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      # Save BEFORE calling Telegram: uncertain delivery must never auto-retry.
      - name: Claim daily delivery
        if: steps.delivery.outputs.cache-hit != 'true'
        run: mkdir -p .delivery-claim && touch .delivery-claim/claimed

      - uses: actions/cache/save@v4
        if: steps.delivery.outputs.cache-hit != 'true'
        with:
          path: .delivery-claim
          key: telegram-day-${{ steps.day.outputs.key }}

      - uses: actions/cache/restore@v4
        id: confirm
        if: steps.delivery.outputs.cache-hit != 'true'
        with:
          path: .delivery-claim
          key: telegram-day-${{ steps.day.outputs.key }}
          fail-on-cache-miss: true

      - name: Build and send market brief
        if: steps.delivery.outputs.cache-hit != 'true' && steps.confirm.outputs.cache-hit == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/market_brief.py
